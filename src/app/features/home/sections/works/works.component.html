<section class="works-section" id="works" #worksSection>
  <div class="works-header" #header>
    <span class="section-label">Proyectos seleccionados</span>
    <h2 class="section-title">Proyectos recientes</h2>
  </div>

  <div class="works-grid" #grid>
    @for (project of projects; track project.id; let i = $index) {
      <article class="work-card" [class.featured]="i === 0" [class.offset]="i % 2 === 1" [class.img-right]="project.id === '05'" [class.img-left]="project.id === '03'">
        <div class="work-image-wrapper">
          <div class="work-image">
            <img [src]="project.image" [alt]="project.title" loading="lazy">
          </div>
          <div class="work-overlay">
            <p class="work-desc">{{ project.description }}</p>
            <span class="work-cta">Ver</span>
          </div>
        </div>
        <div class="work-meta">
          <h3 class="work-title">{{ project.title }}</h3>
          <div class="work-details">
            <span class="work-category">{{ project.category }}</span>
            <span class="work-year">{{ project.year }}</span>
          </div>
        </div>

        @if (project.id === '02') {
          <div class="work-sprite sprite-oshawott">
            <img src="assets/easter-eggs/pokemon/Oshawott_N2B2.gif" alt="Oshawott" />
          </div>
        }
        @if (project.id === '04') {
          <div class="work-sprite sprite-butterfree">
            <img src="assets/easter-eggs/pokemon/Butterfree_shiny.gif" alt="Butterfree" />
          </div>
        }
        @if (project.id === '05') {
          <div class="work-sprite sprite-dragonite">
            <img src="assets/easter-eggs/pokemon/Dragonite_NB.gif" alt="Dragonite" />
          </div>
        }
      </article>
    }
  </div>
</section>
