<section class="portal-section" #portalSection>
  <!-- Interaction overlay — always shows until user engages -->
  <div class="portal-loader" #loader>
    <div class="portal-interaction-hint" #interactionHint>
      <div class="hint-line"></div>
      <span>Tap to enter</span>
    </div>
  </div>

  <!-- Background video (wallpaper-2) -->
  <div class="portal-bg" #bgImage>
    <video #bgVideo muted loop playsinline preload="auto">
      <source src="assets/videos/wallpaper-2.webm" type="video/webm">
      <source src="assets/videos/wallpaper-2.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Chroma key video source (wallpaper-1) -->
  <video #chromaVideo class="chroma-source" muted loop playsinline preload="auto">
    <source src="assets/videos/wallpaper-1.mp4" type="video/mp4">
  </video>

  <!-- WebGL canvas: renders wallpaper-1 with green screen transparent -->
  <canvas #chromaCanvas class="portal-chroma-canvas"></canvas>

  <div class="portal-hint" #hint>
    <div class="hint-line"></div>
    <span>Scroll to enter</span>
  </div>

  <!-- Scroll indicator with deco circle — left side, mid-height -->
  <div class="portal-scroll-wrap" #scrollIndicator>
    <div class="portal-deco-ring"></div>
    <span class="scroll-text">Scroll down</span>
    <div class="scroll-line"></div>
  </div>

  <!-- Decorative year — top right, subtle watermark -->
  <div class="portal-year" #portalYear><span class="year-asterisk">×</span>2025</div>

  <!-- Hero title overlay — asymmetric editorial around the portal circle -->
  <div class="portal-title" #portalTitle>
    <span class="title-small" #titleSmall>entre el</span>
    <span class="title-large title-left" #titleLeft>Diseño</span>
    <span class="title-amp" #titleAmp>y</span>
    <span class="title-large title-right" #titleRight>Desarrollo</span>
  </div>
</section>
