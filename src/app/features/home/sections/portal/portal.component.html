<section class="portal-section" #portalSection>
  <!-- Background video (wallpaper-2) -->
  <div class="portal-bg" #bgImage>
    <video autoplay muted loop playsinline preload="auto" src="assets/videos/wallpaper-2.mp4"></video>
  </div>

  <!-- Chroma key video source (wallpaper-1) -->
  <video #chromaVideo hidden autoplay muted loop playsinline preload="auto" src="assets/videos/wallpaper-1.mp4"></video>

  <!-- WebGL canvas: renders wallpaper-1 with green screen transparent -->
  <canvas #chromaCanvas class="portal-chroma-canvas"></canvas>

  <div class="portal-content">
    <h1 class="portal-title" #title>
      <span class="line">Creative</span>
      <span class="line">Developer</span>
    </h1>
    <p class="portal-subtitle" #subtitle>Portfolio &mdash; 2025</p>
  </div>

  <div class="portal-hint" #hint>
    <div class="hint-line"></div>
    <span>Scroll to enter</span>
  </div>
</section>
